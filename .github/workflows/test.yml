on:
  push:
    branches:
      - '*'

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  #https://github.com/actions/checkout/releases/tag/v6.0.3

      - name: Path Filtering
        uses: spring-media/1up-github-actions@deploy-infra-multiple-test
        with:
         service-name: '...'
         pkg-tokens: '...'
